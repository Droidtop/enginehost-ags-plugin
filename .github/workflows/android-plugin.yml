name: Build enginehost AGS plugin

on:
  push:
    branches: ["plugin/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release on the chosen channel. Stable is
          for a bundle that has been used with real games on hardware; testing
          for one that runs games but has not been lived with. Every push
          already publishes to the unstable channel by itself.
        type: boolean
        default: false
      channel:
        description: "Release channel for a promoted build"
        type: choice
        options: [stable, testing]
        default: stable
      tag:
        description: "Release tag (default: derived from the bundle id; testing adds -testing)"
        type: string
        default: ""

permissions:
  contents: read

# One push supersedes the previous one instead of racing it, keyed on the
# ref so branches and pull requests never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # plugin-core is the wrapper changeset alone, with no AGS tree to build;
    # a line becomes buildable once it is merged into plugin/<version>, so
    # only those branches build and publish.
    #
    # Builds and packs the payload. No signing key and no write token here:
    # the NDK, CMake's dependency downloads, Gradle and its plugins run in
    # this job (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
    if: startsWith(github.ref, 'refs/heads/plugin/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install the NDK the AGS Android project builds with
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.2.9519653" "build-tools;34.0.0" >/dev/null
      - name: Build the runtime APK
        # The AGS Player app carries the runtime library (the engine, SDL2 and
        # the codecs, built by the repository's own CMake for each ABI) and the
        # Enginehost wrapper activity.
        working-directory: Android/agsplayer
        run: ./gradlew assembleRelease --console=plain --stacktrace
      - name: Pack the unsigned bundle inputs
        run: |
          # A long chain of bare `test`s: without tracing, any one of them
          # fails the job silently after a long native build.
          set -x
          apk="$(find Android/agsplayer/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -f "$apk"
          mkdir -p build/unsigned/payload
          cp "$apk" build/unsigned/payload/runtime.apk
          unzip -q "$apk" 'classes*.dex' 'lib/*' -d build/unsigned/payload
          test -f build/unsigned/payload/classes.dex
          # Both ABIs are the rule, not a preference: a bundle that lost one
          # would install and then fail to load on half the devices.
          test -n "$(find build/unsigned/payload/lib/arm64-v8a -name '*.so' -print -quit)"
          test -n "$(find build/unsigned/payload/lib/x86_64 -name '*.so' -print -quit)"
          ls -l build/unsigned/payload/lib/*
          # Declare every dex that is actually present, in load order. A
          # lexical sort puts classes10 before classes2, so order numerically.
          python3 - <<'DEXES'
          import json, pathlib, re
          payload = pathlib.Path('build/unsigned/payload')
          def order(p):
              m = re.fullmatch(r'classes(\d*)\.dex', p.name)
              return int(m.group(1) or 1)
          dexes = sorted(payload.glob('classes*.dex'), key=order)
          assert dexes, 'no classes*.dex in the APK payload'
          data = json.loads(pathlib.Path('enginehost/bundle-metadata.json').read_text())
          data['dexFiles'] = [d.name for d in dexes]
          pathlib.Path('build/unsigned/bundle-metadata.json').write_text(json.dumps(data, indent=2) + '\n')
          print('dexFiles =', data['dexFiles'])
          DEXES
          cp enginehost/LICENSES.md build/unsigned/payload/LICENSES.md
          cp License.txt build/unsigned/payload/LICENSE.ags.txt
          cp LICENSE.enginehost build/unsigned/payload/LICENSE.enginehost.txt
          # A tar keeps the file modes the manifest signs; an artifact would not.
          tar -cf build/unsigned.tar -C build/unsigned payload bundle-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enginehost-ags-bundle-unsigned
          path: build/unsigned.tar
          if-no-files-found: error

  sign:
    # Enginehost's one signing mechanism, pinned by commit: the key never
    # shares a runner with the build.
    needs: android
    if: startsWith(github.ref, 'refs/heads/plugin/')
    permissions:
      contents: read
    uses: Droidtop/enginehost/.github/workflows/sign-engine-bundle.yml@a8a6270dbfe0e7bd475c6d8209e9615960a8c0d7
    with:
      tooling-sha: a8a6270dbfe0e7bd475c6d8209e9615960a8c0d7
      unsigned-artifact: enginehost-ags-bundle-unsigned
      bundle: dev.enginehost.ags.3.v1.enginehost.tar.xz
      artifact-name: enginehost-ags-bundle
    secrets:
      ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}

  publish:
    # Promotion is deliberate: a manual dispatch names the channel. Stable
    # means used with real games on hardware; testing means it runs games
    # but has not been lived with. Enginehost offers each person the channel
    # they chose in Settings and every steadier one.
    needs: sign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enginehost-ags-bundle
          path: release
      - name: Publish the signed bundle on the chosen channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # This job needs: sign. A plugin/* line's sign job always produces a
          # signed bundle, so a missing one there means the upload or the
          # download is broken: fail loudly. Only a branch that is not a
          # plugin/* line has nothing to publish.
          mkdir -p release
          bundle="$(find release -name '*.enginehost.tar.xz' -print -quit)"
          if [ -z "$bundle" ]; then
            if [[ "$GITHUB_REF" == refs/heads/plugin/* ]]; then
              echo "::error::No signed bundle artifact found to publish; the sign job should have produced one on $GITHUB_REF." >&2
              exit 1
            fi
            echo "$GITHUB_REF carries no engine version to bundle (not a plugin/* line); nothing to publish."
            exit 0
          fi
          id="$(basename "$bundle" .enginehost.tar.xz)"
          envelope="$(find release -name 'enginehost-release.json' -print -quit)"
          keydoc="$(find release -name 'enginehost-public-key.json' -print -quit)"
          test -f "$envelope"
          # The envelope names its channel; the app filters on it. The signed
          # manifest inside is untouched.
          python3 - "$envelope" "$CHANNEL" <<'PY'
          import json, sys
          path, channel = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          data["channel"] = channel
          json.dump(data, open(path, "w"), indent=2)
          PY
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(printf '%s' "$id" | sed 's/^dev\.enginehost\.//; s/\./-/g')"
          fi
          case "$CHANNEL" in
            stable) prerelease="" ;;
            testing) [[ "$tag" == *-testing ]] || tag="$tag-testing"; prerelease="--prerelease" ;;
            unstable) [[ "$tag" == *-unstable ]] || tag="$tag-unstable"; prerelease="--prerelease" ;;
            *) echo "unknown channel $CHANNEL" >&2; exit 1 ;;
          esac
          notes="Signed Enginehost bundle \`$id\` on the **$CHANNEL** channel, built from \`$REF_NAME\` at \`$SHA\` (build $RUN_NUMBER). Install it through Enginehost rather than unpacking it by hand: the bundle is verified file by file at install time against the key pinned for this repository."
          if [ "$CHANNEL" = unstable ] || [ "$CHANNEL" = testing ]; then
            # Rolling channels: the selected green build is the whole release,
            # including the tag target and not only clobbered asset bytes.
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --target "$SHA" \
              --title "$id ($CHANNEL)" $prerelease --notes "$notes"
          elif gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --target "$SHA" \
              --title "$id ($CHANNEL)" $prerelease --notes "$notes"
          fi

      - name: Ask droidtop-platforms to reindex
        env:
          # Enginehost reads droidtop-platforms' plugins/index.json before it
          # asks GitHub's API anything, so a release is only offered once that
          # index knows about it. A cross-repository dispatch needs a token of
          # its own; this job's GITHUB_TOKEN cannot reach another repository.
          # Without the secret this is a no-op and the index's scheduled run
          # picks the release up within hours. See droidtop-platforms
          # plugins/README.md.
          GH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "No PLATFORMS_DISPATCH_TOKEN; the plugins index picks this release up on its schedule."
            exit 0
          fi
          gh api repos/Droidtop/droidtop-platforms/dispatches \
            -f event_type=plugin-published \
            -f "client_payload[repo]=$GH_REPO"

  unstable:
    # Every green push that produced a signed bundle is published as-is on
    # the unstable channel, replacing the previous one, so a person who opted
    # into unstable in Enginehost sees each build the moment CI is done with
    # it. Branches whose build makes no bundle publish nothing.
    needs: sign
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enginehost-ags-bundle
          path: release
      - name: Publish the signed bundle on the unstable channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          CHANNEL: unstable
          REQUESTED_TAG: 
        run: |
          set -euo pipefail
          # This job needs: sign. A plugin/* line's sign job always produces a
          # signed bundle, so a missing one there means the upload or the
          # download is broken: fail loudly. Only a branch that is not a
          # plugin/* line has nothing to publish.
          mkdir -p release
          bundle="$(find release -name '*.enginehost.tar.xz' -print -quit)"
          if [ -z "$bundle" ]; then
            if [[ "$GITHUB_REF" == refs/heads/plugin/* ]]; then
              echo "::error::No signed bundle artifact found to publish; the sign job should have produced one on $GITHUB_REF." >&2
              exit 1
            fi
            echo "$GITHUB_REF carries no engine version to bundle (not a plugin/* line); nothing to publish."
            exit 0
          fi
          id="$(basename "$bundle" .enginehost.tar.xz)"
          envelope="$(find release -name 'enginehost-release.json' -print -quit)"
          keydoc="$(find release -name 'enginehost-public-key.json' -print -quit)"
          test -f "$envelope"
          # The envelope names its channel; the app filters on it. The signed
          # manifest inside is untouched.
          python3 - "$envelope" "$CHANNEL" <<'PY'
          import json, sys
          path, channel = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          data["channel"] = channel
          json.dump(data, open(path, "w"), indent=2)
          PY
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(printf '%s' "$id" | sed 's/^dev\.enginehost\.//; s/\./-/g')"
          fi
          case "$CHANNEL" in
            stable) prerelease="" ;;
            testing) [[ "$tag" == *-testing ]] || tag="$tag-testing"; prerelease="--prerelease" ;;
            unstable) [[ "$tag" == *-unstable ]] || tag="$tag-unstable"; prerelease="--prerelease" ;;
            *) echo "unknown channel $CHANNEL" >&2; exit 1 ;;
          esac
          notes="Signed Enginehost bundle \`$id\` on the **$CHANNEL** channel, built from \`$REF_NAME\` at \`$SHA\` (build $RUN_NUMBER). Install it through Enginehost rather than unpacking it by hand: the bundle is verified file by file at install time against the key pinned for this repository."
          if [ "$CHANNEL" = unstable ]; then
            # Rolling: the newest green build of the line is the whole release.
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --target "$SHA" \
              --title "$id (unstable)" $prerelease --notes "$notes"
          elif gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "$bundle" "$envelope" ${keydoc:+"$keydoc"} \
              --target "$SHA" \
              --title "$id ($CHANNEL)" $prerelease --notes "$notes"
          fi

      - name: Ask droidtop-platforms to reindex
        env:
          # Enginehost reads droidtop-platforms' plugins/index.json before it
          # asks GitHub's API anything, so a release is only offered once that
          # index knows about it. A cross-repository dispatch needs a token of
          # its own; this job's GITHUB_TOKEN cannot reach another repository.
          # Without the secret this is a no-op and the index's scheduled run
          # picks the release up within hours. See droidtop-platforms
          # plugins/README.md.
          GH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "No PLATFORMS_DISPATCH_TOKEN; the plugins index picks this release up on its schedule."
            exit 0
          fi
          gh api repos/Droidtop/droidtop-platforms/dispatches \
            -f event_type=plugin-published \
            -f "client_payload[repo]=$GH_REPO"
